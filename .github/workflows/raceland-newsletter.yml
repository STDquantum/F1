name: Download Raceland newsletter

on:
  # GitHub Actions cron is UTC.  12:30 UTC = 20:30 Asia/Shanghai.
  schedule:
    - cron: "30 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF parser
        run: python -m pip install --upgrade pypdf

      - name: Download combined newsletter PDF
        run: |
          mkdir -p tmp
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent "raceland-newsletter-actions" \
            --output tmp/ausgabe.pdf \
            https://newsletter.raceland.de/gb/epaper/ausgabe.pdf

      - name: Split newest and previous newsletters
        run: |
          python scripts/split_raceland_pdf.py \
            --input tmp/ausgabe.pdf \
            --output-dir raceland_Newsletter \
            --archive-dir raceland_Newsletter \
            --manifest tmp/raceland-manifest.txt

      - name: Commit new newsletter PDFs
        run: |
          while IFS= read -r file; do
            git add -- "$file"
          done < tmp/raceland-manifest.txt

          if git diff --cached --quiet; then
            echo "No newsletter changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Raceland newsletter"
          git push
