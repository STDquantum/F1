name: Update F1 current-season data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 12:00 Asia/Shanghai (04:00 UTC).
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: f1_results_scraper
        run: python -m pip install -r requirements.txt

      - name: Snapshot current-season data
        id: snapshot
        run: |
          YEAR=$(date -u +%Y)
          BEFORE="$RUNNER_TEMP/f1-$YEAR-before.js"
          SOURCE="f1_results_scraper/site_data/$YEAR.js"
          if [[ -f "$SOURCE" ]]; then
            cp "$SOURCE" "$BEFORE"
          else
            : > "$BEFORE"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Crawl current-season races
        working-directory: f1_results_scraper
        run: |
          YEAR=$(date -u +%Y)
          python scraper.py --start-year "$YEAR" --end-year "$YEAR" --delay 0.5 --refresh --output data

      - name: Crawl current-season drivers, teams, and awards
        working-directory: f1_results_scraper
        run: |
          YEAR=$(date -u +%Y)
          python standings_scraper.py --start-year "$YEAR" --end-year "$YEAR" --delay 0.5 --output data

      - name: Rebuild current-season static data files
        working-directory: f1_results_scraper
        run: python build_static.py

      - name: Print the tables with the largest changes
        id: change_report
        run: |
          REPORT="$RUNNER_TEMP/f1-change-report.md"
          python f1_results_scraper/action_change_report.py \
            --before "${{ steps.snapshot.outputs.before }}" \
            --after "f1_results_scraper/site_data/${{ steps.snapshot.outputs.year }}.js" \
            --limit 15 \
            --markdown "$REPORT"
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Commit updated data to the repository
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1_results_scraper/index.html f1_results_scraper/site_data
          if git diff --cached --quiet; then
            echo "No current-season data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update current-season F1 data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send DingTalk notification
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          DATA_CHANGED: ${{ steps.commit.outputs.changed }}
          CHANGE_REPORT_PATH: ${{ steps.change_report.outputs.path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          webhook = os.getenv("DINGTALK_WEBHOOK", "").strip()
          if not webhook:
              print("DINGTALK_WEBHOOK is not configured, skip DingTalk notification.")
              raise SystemExit(0)

          status = os.getenv("JOB_STATUS", "unknown")
          changed = os.getenv("DATA_CHANGED", "")
          report_path = os.getenv("CHANGE_REPORT_PATH", "")
          report = ""
          if report_path and Path(report_path).is_file():
              report = Path(report_path).read_text(encoding="utf-8").strip()
          if status == "success":
              if changed == "true":
                  text = "### 成绩 F1 数据更新完成\n\n当前赛季数据已更新并提交到仓库。"
              else:
                  text = "### 成绩 F1 数据更新完成\n\n本次运行未发现数据变化，未产生提交。"
          else:
              text = f"### 成绩 F1 数据更新失败\n\n工作流状态：**{status}**，请查看 GitHub Actions 日志。"
          if report:
              text += "\n\n" + report

          payload = json.dumps(
              {"msgtype": "markdown", "markdown": {"title": "F1 数据更新", "text": text}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("errcode") != 0:
              raise RuntimeError(f"DingTalk rejected message: {result}")
          PY
