name: Update F1 current-season data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 12:00 Asia/Shanghai (04:00 UTC).
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: f1_results_scraper
        run: python -m pip install -r requirements.txt

      - name: Crawl current-season races
        working-directory: f1_results_scraper
        run: |
          YEAR=$(date -u +%Y)
          python scraper.py --start-year "$YEAR" --end-year "$YEAR" --delay 0.5 --output data

      - name: Crawl current-season drivers, teams, and awards
        working-directory: f1_results_scraper
        run: |
          YEAR=$(date -u +%Y)
          python standings_scraper.py --start-year "$YEAR" --end-year "$YEAR" --delay 0.5 --output data

      - name: Rebuild current-season static data files
        working-directory: f1_results_scraper
        run: python build_static.py

      - name: Commit updated data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1_results_scraper/index.html f1_results_scraper/site_data
          if git diff --cached --quiet; then
            echo "No current-season data changes."
          else
            git commit -m "Update current-season F1 data"
            git push
          fi
