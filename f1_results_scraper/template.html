<script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let manifest={},records=[],year=0,section='races',raceKey='all',sessionKey='season',loaded={};
const STATE_KEY='f1-results-selection-v1';
function readState(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||'{}')}catch{return{}}}
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify({year,section,raceKey,sessionKey}))}catch{}}
function loadScript(src){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=src+'?v='+Date.now();s.onload=()=>ok();s.onerror=no;document.head.appendChild(s)})}
function raceId(x){return x.race?String(x.race.race_id):'season'}function driverId(x){return x.driver?String(x.driver.driver_id):'season'}function teamId(x){return x.team?String(x.team.slug):'season'}function awardId(x){return x.award?String(x.award.slug):'season'}function groupId(x){return section==='drivers'?driverId(x):section==='teams'?teamId(x):section==='awards'?awardId(x):raceId(x)}function titleCase(s){return String(s||'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace(/\s+-\s+/g,'-')}function nameCase(s){return String(s||'').toLocaleLowerCase('en-US').replace(/(^|[\s'-])([A-Za-zÀ-ÖØ-öø-ÿ])/g,(m,p,c)=>p+c.toLocaleUpperCase('en-US'))}function driverName(x){return nameCase(String(x.title||'').replace(/^\d{4}\s+/,'').replace(/\s+DRIVER STANDINGS$/i,'').trim()||titleCase(x.driver?.slug||''))}function groupName(x){return section==='drivers'?driverName(x):section==='teams'?titleCase(x.team?.slug||''):section==='awards'?titleCase(x.award?.slug||''):titleCase(x.race?.slug||'')}
function sessionName(x){if(section==='drivers'&&x?.driver)return'Driver Details';if(section==='teams'&&x?.team)return'Team Details';if(section==='awards'&&x?.award)return'Award Results';if(!x||!x.session)return'Season Summary';let u=String(x.url||'').toLowerCase();if(u.includes('/race-result'))return'Race Result';if(u.includes('/starting-grid'))return'Starting Grid';if(u.includes('/pit-stop-summary'))return'Pit Stop Summary';if(u.includes('/fastest-laps'))return'Fastest Laps';if(u.includes('/practice/0'))return'Warm Up';if(u.includes('/practice/1'))return'Practice 1';if(u.includes('/practice/2'))return'Practice 2';if(u.includes('/practice/3'))return'Practice 3';if(u.includes('/qualifying/0'))return'Overall Qualifying';if(u.includes('/qualifying/1'))return'Qualifying 1';if(u.includes('/qualifying/2'))return'Qualifying 2';return titleCase(x.session)}
async function loadYear(y){if(!loaded[y]){window.__F1_YEAR_DATA__=[];await loadScript('site_data/'+y+'.js');loaded[y]=window.__F1_YEAR_DATA__||[]}records=loaded[y];draw()}
function cellHtml(r,c){let text=String(r[c]??''),imgs=r[c+'__images']||[];for(let im of imgs)if(im.alt)text=text.replace(im.alt,'').trim();return imgs.map(im=>'<span class="imgbox" style="'+esc(im.background||'')+'"><img class="cellimg" src="'+esc(im.src)+'" alt="'+esc(im.alt)+'" title="'+esc(im.alt)+'"></span>').join('')+esc(text)}
function draw(){if(!year||!records.length){$('title').textContent='暂无数据';return}if(!records.some(x=>x.section===section))section='races';$('years').value=year;$('tabs').innerHTML=['races','drivers','teams','awards'].map(s=>'<button class="'+(s===section?'active':'')+'" data-s="'+s+'">'+s[0].toUpperCase()+s.slice(1)+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s;raceKey='all';sessionKey='season';draw()});let all=[...new Map(records.filter(x=>x.section===section).map(x=>[groupId(x),x])).values()],opts=(section==='awards'?[]:[{k:'all',t:'All'}]).concat(all.filter(x=>groupId(x)!=='season').map(x=>({k:groupId(x),t:groupName(x)})));if(!opts.some(x=>x.k===raceKey))raceKey=opts[0]?.k||'all';$('race').innerHTML=opts.map(o=>'<option value="'+esc(o.k)+'">'+esc(o.t)+'</option>').join('');$('race').value=raceKey;let pool=records.filter(x=>x.section===section&&(raceKey==='all'?groupId(x)==='season':groupId(x)===raceKey)),ss=[...new Map(pool.map(x=>[x.url,x])).values()];if(raceKey==='all')sessionKey='season';else if(!ss.some(x=>x.url===sessionKey)){let result=ss.find(x=>x.session==='race-result');sessionKey=result?result.url:(ss[0]?.url||'all')}$('session').innerHTML=raceKey==='all'?'<option value="season">Season Summary</option>':ss.map(x=>'<option value="'+esc(x.url)+'">'+esc(sessionName(x))+'</option>').join('');$('session').value=sessionKey;$('session').style.display=(section==='drivers'||section==='teams'||section==='awards'||(section==='races'&&raceKey==='all'))?'none':'';$('race').onchange=e=>{e.target.blur();raceKey=e.target.value;sessionKey='season';draw()};$('session').onchange=e=>{e.target.blur();sessionKey=e.target.value;draw()};let visible=records.filter(x=>x.section===section&&(raceKey==='all'?groupId(x)==='season':groupId(x)===raceKey)&&(sessionKey==='season'?groupId(x)==='season':x.url===sessionKey)),x=visible[0],notes=x?.notes||[];$('crumb').textContent=year+' / '+section.toUpperCase();$('title').textContent=x?.title||year+' '+section.toUpperCase();$('eventInfo').innerHTML=x?.event_date?esc(x.event_date)+'<span>'+esc(x.circuit||'')+'</span>':'';$('meta').textContent=x?x.rows.length+' rows · '+x.columns.length+' columns · '+x.url:'请选择表格';$('thead').innerHTML=x?'<tr>'+x.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>':'';$('tbody').innerHTML=x?x.rows.map(r=>'<tr>'+x.columns.map(c=>'<td>'+cellHtml(r,c)+'</td>').join('')+'</tr>').join(''):'';document.querySelector('.scroll').scrollLeft=0;$('notes').innerHTML=notes.map(note=>'<p>'+esc(note)+'</p>').join('');$('notes').style.display=notes.length?'block':'none';$('empty').style.display=x?'none':'block';$('stats').textContent=manifest.total_tables.toLocaleString()+' tables · '+manifest.total_pages.toLocaleString()+' pages · '+manifest.failures+' failed';$('updated').textContent='已加载 '+year;saveState()}
async function init(){try{await loadScript('site_data/index.js');manifest=window.__F1_MANIFEST__||{};let ys=manifest.years||[],saved=readState(),savedYear=Number(saved.year),params=new URLSearchParams(location.search),queryYear=Number(params.get('year')),queryRace=params.get('race'),querySession=params.get('session'),hasQuery=ys.includes(queryYear);$('years').innerHTML=ys.map(y=>'<option value="'+y+'">'+y+'</option>').join('');$('years').onchange=async e=>{e.target.blur();year=+e.target.value;raceKey='all';sessionKey='season';await loadYear(year)};section=hasQuery?'races':(['races','drivers','teams','awards'].includes(saved.section)?saved.section:'races');raceKey=hasQuery&&queryRace?queryRace:(typeof saved.raceKey==='string'?saved.raceKey:'all');sessionKey=hasQuery&&querySession?querySession:(typeof saved.sessionKey==='string'?saved.sessionKey:'season');year=hasQuery?queryYear:(ys.includes(savedYear)?savedYear:(ys[0]||2026));await loadYear(year)}catch(e){$('updated').textContent='无法读取年份数据，请确认 site_data 文件存在'}}init();
</script><script>
(()=>{const input=document.getElementById('quickSearchInput'),form=document.getElementById('quickSearchForm'),box=document.getElementById('quickResults');let shards=[],cache=new Map(),timer=0,version=0;const escq=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localResult(x){const race=x.u.match(/\/races\/(\d+)\//)?.[1]||'';return `index.html?year=${encodeURIComponent(x.y)}&race=${encodeURIComponent(race)}&session=${encodeURIComponent(x.u)}`}function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('无法加载 '+src));document.head.appendChild(s)})}async function shard(meta){if(!cache.has(meta.year)){cache.set(meta.year,(async()=>{window.__F1_SEARCH_SHARDS__=window.__F1_SEARCH_SHARDS__||{};await load(meta.file);return window.__F1_SEARCH_SHARDS__[meta.year]||[]})())}return cache.get(meta.year)}function showMessage(msg){box.innerHTML=`<div class="quick-message">${escq(msg)}</div>`;box.classList.add('open')}async function suggest(){const seq=++version,q=input.value.trim().toLocaleLowerCase();if(q.length<2){box.classList.remove('open');box.innerHTML='';return}showMessage('正在检索…');try{if(!shards.length){await load('site_data/search_index/index.js');shards=window.__F1_SEARCH_MANIFEST__||[]}const data=await Promise.all(shards.map(shard));if(seq!==version)return;const hits=[];for(const rows of data)for(const x of rows){if(entryMatches(x))hits.push(x)}const gpOnly=isGrandPrixOnly(hits),results=dedupeGrandPrix(hits);results.sort((a,b)=>b.y-a.y||a.g.localeCompare(b.g));if(!results.length){showMessage('没有找到匹配结果');return}box.innerHTML=results.slice(0,8).map(x=>`<a class="quick-result" href="${escq(localResult(x))}"><b>${x.y}</b>${escq(x.g)}<small>${gpOnly?'大奖赛赛果':escq(x.d)+(x.t?' · '+escq(x.t):'')+(x.c?' · '+escq(x.c):'')}</small></a>`).join('')+`<div class="quick-message">找到 ${results.length.toLocaleString()} 条；继续输入缩小范围，按 Enter 查看完整结果</div>`;box.classList.add('open')}catch(e){if(seq===version)showMessage('搜索索引读取失败：'+e.message)}}input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(suggest,220)});form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)location.href='search.html?q='+encodeURIComponent(q)});document.addEventListener('click',e=>{if(!e.target.closest('.quick-search'))box.classList.remove('open')});})();
</script><script>
function searchTerms(){return (document.getElementById('quickSearchInput')?.value||document.getElementById('q')?.value||'').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}
function oneTypo(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(i<a.length||j<b.length?1:0)<=1}
function fieldMatches(value,term){const field=String(value||'').toLocaleLowerCase();return field.includes(term)||(term.length>=5&&field.split(/[^a-z0-9]+/).some(word=>oneTypo(term,word)))}
function entryMatches(x){const terms=searchTerms(),fields=[x.d,x.g,x.t,x.c];return terms.length>0&&terms.every(term=>fields.some(field=>fieldMatches(field,term)))}
function isGrandPrixOnly(hits){const terms=searchTerms();return hits.length>0&&terms.length>0&&hits.every(x=>terms.every(term=>fieldMatches(x.g,term)))}
function dedupeGrandPrix(hits){if(!isGrandPrixOnly(hits))return hits;return [...new Map(hits.map(x=>[`${x.y}|${x.u}`,x])).values()]}
</script></body></html>
