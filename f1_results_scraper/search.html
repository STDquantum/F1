<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 历史结果搜索</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#171821;background:#f5f3f1}*{box-sizing:border-box}body{margin:0}.top{background:#15161d;color:white;padding:22px 5vw}.brand{font-size:28px;font-weight:900;font-style:italic}.sub{color:#aaa;font-size:13px;margin-top:6px}.wrap{max-width:1100px;margin:auto;padding:28px 5vw}h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.hint{color:#666;margin:0 0 22px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-width:0;border:2px solid #171821;border-radius:12px;padding:14px 16px;font-size:17px}.search button{background:#e10600;color:white;border:0;border-radius:12px;padding:0 22px;font-weight:800;font-size:16px;cursor:pointer}.status{color:#777;font-size:13px;margin:14px 0}.list{display:grid;gap:10px}.item{background:white;border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px #0000000c}.item strong{font-size:17px}.item .detail{color:#555;margin-top:6px}.item .year{color:#e10600;font-weight:800;margin-right:8px}.item a{color:inherit;text-decoration:none}.item a:hover strong{color:#e10600}.empty{padding:36px;text-align:center;color:#777;background:#fff;border-radius:12px}.back{color:#fff;opacity:.8}
.return-float{position:fixed;right:24px;bottom:24px;z-index:30;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:50%;background:#e10600;color:#fff;text-decoration:none;font-size:28px;font-weight:700;line-height:1;box-shadow:0 4px 16px #0003;transition:transform .18s,background .18s}.return-float:hover{background:#b80500;transform:translateY(-2px)}.return-float:focus-visible{outline:3px solid #171821;outline-offset:3px}@media(max-width:700px){.return-float{right:16px;bottom:16px;width:52px;height:52px}}
</style></head><body>
<header class="top"><div class="brand">FORMULA 1</div><div class="sub">F1 历年结果搜索</div></header>
<main class="wrap"><h1>搜索历史赛果</h1><p class="hint">输入车手、车队、大奖赛或底盘型号；可输入部分名称，例如 Norris、Monaco 或 Ferrari。</p>
<form class="search" id="form"><input id="q" type="search" placeholder="车手 / 车队 / 大奖赛 / 底盘型号" autocomplete="off"><button type="submit">搜索</button></form>
<div class="status" id="status">输入关键词即可搜索；结果随输入更新。</div><div class="list" id="list"></div><p><a href="index.html">返回结果浏览页</a></p></main>
<a class="return-float" href="index.html" aria-label="返回赛果浏览页" title="返回赛果浏览页">←</a>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let manifest=[],cache=new Map();
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok();s.onerror=()=>no(new Error('无法加载 '+src));document.head.appendChild(s)})}
async function getShard(meta){if(!cache.has(meta.year)){cache.set(meta.year,(async()=>{window.__F1_SEARCH_SHARDS__=window.__F1_SEARCH_SHARDS__||{};await loadScript(meta.file);return window.__F1_SEARCH_SHARDS__[meta.year]||[]})())}return cache.get(meta.year)}
async function search(){const q=$('q').value.trim().toLocaleLowerCase();if(!q){$('status').textContent='输入关键词即可搜索；结果随输入更新。';$('list').innerHTML='';return}if(q.length<2){$('status').textContent='再输入一个字符开始检索';$('list').innerHTML='';return}$('status').textContent='正在检索…';$('list').innerHTML='';try{const shards=await Promise.all(manifest.map(getShard));const hits=[];for(const rows of shards)for(const x of rows){if(entryMatches(x))hits.push(x)}const gpOnly=isGrandPrixOnly(hits),results=dedupeGrandPrix(hits);results.sort((a,b)=>b.y-a.y||a.g.localeCompare(b.g));$('status').textContent=`找到 ${results.length.toLocaleString()} 条匹配记录。`;$('list').innerHTML=results.length?results.map(x=>{const raceId=x.u.match(/\/races\/(\d+)\//)?.[1]||'';const localUrl=`index.html?year=${encodeURIComponent(x.y)}&race=${encodeURIComponent(raceId)}&session=${encodeURIComponent(x.u)}`;const detail=gpOnly?'大奖赛赛果':`车手：${esc(x.d)}${x.t?`　·　车队：${esc(x.t)}`:''}${x.c?`　·　底盘：${esc(x.c)}`:''}`;return `<article class="item"><a href="${esc(localUrl)}"><span class="year">${x.y}</span><strong>${esc(x.g)}</strong><div class="detail">${detail}</div></a></article>`}).join(''):'<div class="empty">没有找到匹配结果</div>'}catch(e){$('status').textContent='读取搜索分片失败：'+e.message}}
async function init(){try{await loadScript('site_data/search_index/index.js');manifest=window.__F1_SEARCH_MANIFEST__||[];const initialQuery=new URLSearchParams(location.search).get('q');if(initialQuery){$('q').value=initialQuery;search()}else{$('status').textContent='输入关键词即可搜索；结果随输入更新。'}}catch(e){$('status').textContent='无法读取索引清单：'+e.message}}
$('form').addEventListener('submit',e=>{e.preventDefault();search()});let searchTimer; $('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,180)});init();
</script><script>
function searchTerms(){return (document.getElementById('quickSearchInput')?.value||document.getElementById('q')?.value||'').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}
function oneTypo(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(i<a.length||j<b.length?1:0)<=1}
function fieldMatches(value,term){const field=String(value||'').toLocaleLowerCase();return field.includes(term)||(term.length>=5&&field.split(/[^a-z0-9]+/).some(word=>oneTypo(term,word)))}
function entryMatches(x){const terms=searchTerms(),fields=[x.d,x.g,x.t,x.c];return terms.length>0&&terms.every(term=>fields.some(field=>fieldMatches(field,term)))}
function isGrandPrixOnly(hits){const terms=searchTerms();return hits.length>0&&terms.length>0&&hits.every(x=>terms.every(term=>fieldMatches(x.g,term)))}
function dedupeGrandPrix(hits){if(!isGrandPrixOnly(hits))return hits;return [...new Map(hits.map(x=>[`${x.y}|${x.u}`,x])).values()]}
</script></body></html>
